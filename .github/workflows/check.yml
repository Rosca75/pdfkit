#
# The same gate the pre-push hook runs, for hosted CI: the checks tier, the
# unit tier and the ABI tier on Windows with the pinned toolchain of
# build/toolchain.md, on every push; and the unit and ABI tiers of the ARM64
# build on an ARM64 runner, because a cross-compiled library nobody ran is a
# package nobody tested. The pre-push hook (build/hooks/pre-push)
# and the local merge gate stay the gate, because the sanitizer and dataset
# tiers need the laptop's caches; this run is the second reading of each push.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    env:
      # WinLibs GCC 16.1.0 (UCRT, POSIX threads, SEH), release r2, as on the laptop.
      WINLIBS_URL: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.1.0posix-14.0.0-ucrt-r2/winlibs-x86_64-posix-seh-gcc-16.1.0-mingw-w64ucrt-14.0.0-r2.zip
      WINLIBS_SHA256: 78eff1e2e804b6a6320c713f084b8f820c662104a24cea6a3bfcab82032bdd60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install the pinned WinLibs toolchain
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\winlibs.zip"
          Invoke-WebRequest -Uri $env:WINLIBS_URL -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($hash -ne $env:WINLIBS_SHA256) { throw "WinLibs archive hash $hash, expected $env:WINLIBS_SHA256" }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\winlibs"
          "$env:RUNNER_TEMP\winlibs\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install clang-format and clang-tidy
        run: python -m pip install --user --require-hashes -r build/requirements-dev.txt

      # The generated-files check re-runs build/fonts/subset.py, which needs its pinned fontTools.
      - name: Install fontTools for the font generators
        run: python -m pip install --user --require-hashes -r build/fonts/requirements.txt

      - name: Checks tier
        run: python build/check.py --full

      - name: Unit tier
        run: ctest --preset unit

      - name: ABI tier
        run: python tests/abi/run.py

  arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: ./.github/actions/arm64-toolchain

      - name: Build the ARM64 debug and release presets
        run: |
          cmake --preset arm64-debug
          cmake --build --preset arm64-debug
          cmake --preset arm64-release
          cmake --build --preset arm64-release

      - name: Artefact tables of the ARM64 release build
        run: python build/check_artefact.py out/arm64-release

      - name: Unit tier on ARM64
        run: ctest --preset unit-arm64

      - name: ABI tier on ARM64
        run: python tests/abi/run.py --preset arm64-release
