#
# Installs the toolchain of the arm64 presets on a Windows ARM64 runner, each
# archive pinned by SHA-256 as build/toolchain.md records it: llvm-mingw's
# build for an ARM64 host (its aarch64 clang builds the package, its
# llvm-objdump reads the artefact's tables), and the ARM64 builds of the
# pinned CMake and Ninja, because the WinLibs package that brings them on x64
# has no ARM64 build. Sets PDFKIT_LLVM_MINGW_ARM64 and PDFKIT_OBJDUMP for
# build/llvm-mingw-arm64.cmake and build/check_artefact.py.
name: arm64-toolchain
description: llvm-mingw (ARM64 host), CMake and Ninja for the arm64 presets, pinned by hash

runs:
  using: composite
  steps:
    - name: Fetch and verify the pinned archives
      shell: pwsh
      env:
        LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-aarch64.zip
        LLVM_MINGW_SHA256: 8f24fedd0b75c674c6c83dec2d76a7ac31a690120212843a17e465ef49854f69
        CMAKE_URL: https://github.com/Kitware/CMake/releases/download/v4.3.2/cmake-4.3.2-windows-arm64.zip
        CMAKE_SHA256: 42a2a88fc57e70d04a92f6eaaac2094241995f53584bc2afdae7e6ef982b3781
        NINJA_URL: https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-winarm64.zip
        NINJA_SHA256: e52f0bdef9dfb1003229dbd6508a508c4073fd017247002adc66e5e806cb0391
      run: |
        $tools = "$env:RUNNER_TEMP\arm64-toolchain"
        New-Item -ItemType Directory -Force -Path $tools | Out-Null
        foreach ($name in "LLVM_MINGW", "CMAKE", "NINJA") {
          $url = [Environment]::GetEnvironmentVariable("${name}_URL")
          $expected = [Environment]::GetEnvironmentVariable("${name}_SHA256")
          $zip = Join-Path $tools ([IO.Path]::GetFileName($url))
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($hash -ne $expected) { throw "$url has SHA-256 $hash, expected $expected (build/toolchain.md)" }
          Expand-Archive -Path $zip -DestinationPath (Join-Path $tools $name.ToLower())
        }
        $llvm = Join-Path $tools "llvm_mingw\llvm-mingw-20261020-ucrt-aarch64"
        "PDFKIT_LLVM_MINGW_ARM64=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "PDFKIT_OBJDUMP=$llvm\bin\llvm-objdump.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        (Join-Path $tools "cmake\cmake-4.3.2-windows-arm64\bin") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        (Join-Path $tools "ninja") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
